                if (userAnswer === correctAnswer) {
                    input.classList.remove('incorrect');
                    input.classList.add('correct');
                    correct++;
                } else {
                    input.classList.remove('correct');
                    input.classList.add('incorrect');
                    // Show correct answer as placeholder
                    input.setAttribute('data-correct', correctAnswer);
                }
            });

            const resultsDiv = document.getElementById('blankResults');
            const percentage = Math.round((correct / totalBlanks) * 100);
            
            resultsDiv.innerHTML = `
                <div class="blank-score">
                    <i class="fas fa-${percentage === 100 ? 'trophy' : 'chart-bar'}"></i>
                    Natija: ${correct}/${totalBlanks} (${percentage}%)
                    ${percentage === 100 ? '<br>🎉 Juda ajoyib!' : percentage >= 70 ? '<br>👍 Yaxshi!' : '<br>💪 Yana harakat qiling!'}
                </div>
            `;
            resultsDiv.classList.add('show');
        };

        // ==================== MATCHING GAME FUNCTIONS ====================
        let matchingState = {
            selectedLeft: null,
            selectedRight: null,
            matches: [],
            attempts: 0
        };

        let dragState = {
            isDragging: false,
            startItem: null,
            currentX: 0,
            currentY: 0,
            tempCanvas: null
        };

        function initMatchingGame(topic) {
            const game = topic.quiz.matchingGame;
            const shuffledRight = [...game.pairs].sort(() => Math.random() - 0.5);

            const leftColumn = document.getElementById('leftColumn');
            const rightColumn = document.getElementById('rightColumn');
            
            leftColumn.innerHTML = game.pairs.map((pair, index) => `
                <div class="matching-item" data-left="${index}" data-word="${pair.left}">
                    ${pair.left}
                </div>
            `).join('');
            
            rightColumn.innerHTML = shuffledRight.map((pair) => `
                <div class="matching-item" data-right="${game.pairs.findIndex(p => p.right === pair.right)}" data-word="${pair.right}">
                    ${pair.right}
                </div>
            `).join('');

            setTimeout(() => {
                setupMatchingCanvas();
                attachMatchingListeners();
            }, 100);
        }

        function setupMatchingCanvas() {
            const container = document.getElementById('matchingColumns');
            const canvas = document.getElementById('matchingCanvas');
            if (!container || !canvas) return;

            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            let resizeTimeout;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimeout);
                resizeTimeout = setTimeout(() => {
                    if (canvas && container) {
                        canvas.width = container.offsetWidth;
                        canvas.height = container.offsetHeight;
                        redrawAllConnections();
                    }
                }, 250);
            });
        }

        function attachMatchingListeners() {
            const container = document.getElementById('matchingColumns');
            if (!container) return;

            document.querySelectorAll('.matching-item[data-left]').forEach(item => {
                item.addEventListener('mousedown', function(e) {
                    startDrag(this, e.clientX, e.clientY);
                });

                item.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    startDrag(this, touch.clientX, touch.clientY);
                }, { passive: false });

                item.addEventListener('click', function() {
                    if (dragState.isDragging) return;
                    if (this.classList.contains('matched')) return;
                    
                    document.querySelectorAll('.matching-item[data-left]').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    matchingState.selectedLeft = parseInt(this.dataset.left);
                    
                    if (matchingState.selectedRight !== null) {
                        createMatch();
                    }
                });
            });

            document.querySelectorAll('.matching-item[data-right]').forEach(item => {
                item.addEventListener('click', function() {
                    if (dragState.isDragging) return;
                    if (this.classList.contains('matched')) return;
                    
                    document.querySelectorAll('.matching-item[data-right]').forEach(i => i.classList.remove('selected'));
                    this.classList.add('selected');
                    matchingState.selectedRight = parseInt(this.dataset.right);
                    
                    if (matchingState.selectedLeft !== null) {
                        createMatch();
                    }
                });
            });

            container.addEventListener('mousemove', function(e) {
                if (dragState.isDragging) {
                    updateDragLine(e.clientX, e.clientY);
                }
            });

            container.addEventListener('touchmove', function(e) {
                if (dragState.isDragging) {
                    e.preventDefault();
                    const touch = e.touches[0];
                    updateDragLine(touch.clientX, touch.clientY);
                }
            }, { passive: false });

            document.addEventListener('mouseup', function(e) {
                if (dragState.isDragging) {
                    endDrag(e.clientX, e.clientY);
                }
            });

            document.addEventListener('touchend', function(e) {
                if (dragState.isDragging) {
                    const touch = e.changedTouches[0];
                    endDrag(touch.clientX, touch.clientY);
                }
            });
        }

        function startDrag(item, x, y) {
            if (item.classList.contains('matched')) return;

            dragState.isDragging = true;
            dragState.startItem = item;
            dragState.currentX = x;
            dragState.currentY = y;

            item.classList.add('drawing');

            if (!dragState.tempCanvas) {
                const container = document.getElementById('matchingColumns');
                const canvas = document.createElement('canvas');
                canvas.className = 'temp-line';
                canvas.width = container.offsetWidth;
                canvas.height = container.offsetHeight;
                container.appendChild(canvas);
                dragState.tempCanvas = canvas;
            }
        }

        function updateDragLine(x, y) {
            if (!dragState.isDragging || !dragState.tempCanvas || !dragState.startItem) return;

            const container = document.getElementById('matchingColumns');
            const containerRect = container.getBoundingClientRect();
            const startRect = dragState.startItem.getBoundingClientRect();

            const ctx = dragState.tempCanvas.getContext('2d');
            ctx.clearRect(0, 0, dragState.tempCanvas.width, dragState.tempCanvas.height);

            const startX = startRect.right - containerRect.left;
            const startY = startRect.top + startRect.height / 2 - containerRect.top;
            const endX = x - containerRect.left;
            const endY = y - containerRect.top;

            const isMobile = window.innerWidth <= 480;
            const isTablet = window.innerWidth <= 768 && window.innerWidth > 480;
            
            const lineWidth = isMobile ? 3 : (isTablet ? 3.5 : 4);
            const shadowBlur = isMobile ? 5 : (isTablet ? 8 : 10);
            const circleRadius = isMobile ? 4 : (isTablet ? 5 : 6);

            ctx.strokeStyle = 'rgba(255, 152, 0, 0.8)';
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.shadowBlur = shadowBlur;
            ctx.shadowColor = 'rgba(255, 152, 0, 0.5)';

            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            const baseOffset = Math.min(Math.abs(endX - startX) / 3, 60);
            const controlOffset = isMobile ? Math.min(baseOffset, 30) : baseOffset;
            ctx.bezierCurveTo(
                startX + controlOffset, startY,
                endX - controlOffset, endY,
                endX, endY
            );
            
            ctx.stroke();

            ctx.fillStyle = 'rgba(255, 152, 0, 0.9)';
            ctx.shadowBlur = isMobile ? 3 : 5;
            ctx.beginPath();
            ctx.arc(startX, startY, circleRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(endX, endY, circleRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        function endDrag(x, y) {
            if (!dragState.isDragging) return;

            const targetElement = document.elementFromPoint(x, y);
            const rightItem = targetElement?.closest('.matching-item[data-right]');

            if (rightItem && !rightItem.classList.contains('matched')) {
                const leftIndex = parseInt(dragState.startItem.dataset.left);
                const rightIndex = parseInt(rightItem.dataset.right);

                matchingState.selectedLeft = leftIndex;
                matchingState.selectedRight = rightIndex;
                createMatch();
            }

            if (dragState.startItem) {
                dragState.startItem.classList.remove('drawing');
            }

            if (dragState.tempCanvas) {
                dragState.tempCanvas.remove();
                dragState.tempCanvas = null;
            }

            dragState.isDragging = false;
            dragState.startItem = null;
        }

        function createMatch() {
            if (matchingState.selectedLeft === null || matchingState.selectedRight === null) return;

            const leftItem = document.querySelector(`.matching-item[data-left="${matchingState.selectedLeft}"]`);
            const rightItem = document.querySelector(`.matching-item[data-right="${matchingState.selectedRight}"]`);

            if (!leftItem || !rightItem) return;

            matchingState.matches.push({
                left: matchingState.selectedLeft,
                right: matchingState.selectedRight
            });

            leftItem.classList.remove('selected');
            rightItem.classList.remove('selected');
            leftItem.classList.add('matched');
            rightItem.classList.add('matched');

            drawConnection(leftItem, rightItem, matchingState.matches.length - 1);

            matchingState.selectedLeft = null;
            matchingState.selectedRight = null;
        }

        function drawConnection(leftItem, rightItem, colorIndex) {
            const canvas = document.getElementById('matchingCanvas');
            if (!canvas) return;

            const ctx = canvas.getContext('2d');
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7B731', '#5F27CD', '#00D2D3'];
            
            const leftRect = leftItem.getBoundingClientRect();
            const rightRect = rightItem.getBoundingClientRect();
            const containerRect = canvas.getBoundingClientRect();

            const startX = leftRect.right - containerRect.left;
            const startY = leftRect.top + leftRect.height / 2 - containerRect.top;
            const endX = rightRect.left - containerRect.left;
            const endY = rightRect.top + rightRect.height / 2 - containerRect.top;

            const color = colors[colorIndex % colors.length];
            
            const isMobile = window.innerWidth <= 480;
            const isTablet = window.innerWidth <= 768 && window.innerWidth > 480;
            
            const lineWidth = isMobile ? 2.5 : (isTablet ? 3 : 4);
            const shadowBlur = isMobile ? 4 : (isTablet ? 6 : 8);
            const circleRadius = isMobile ? 4 : (isTablet ? 5 : 6);
            
            ctx.shadowBlur = shadowBlur;
            ctx.shadowColor = 'rgba(0, 0, 0, 0.2)';
            
            ctx.strokeStyle = color;
            ctx.lineWidth = lineWidth;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(startX, startY);
            
            const baseOffset = Math.min(Math.abs(endX - startX) / 3, 60);
            const controlOffset = isMobile ? Math.min(baseOffset, 30) : baseOffset;
            ctx.bezierCurveTo(
                startX + controlOffset, startY,
                endX - controlOffset, endY,
                endX, endY
            );
            
            ctx.stroke();

            ctx.shadowBlur = 0;

            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(startX, startY, circleRadius, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(endX, endY, circleRadius, 0, Math.PI * 2);
            ctx.fill();
        }

        function redrawAllConnections() {
            clearCanvas();
            
            matchingState.matches.forEach((match, index) => {
                const leftItem = document.querySelector(`.matching-item[data-left="${match.left}"]`);
                const rightItem = document.querySelector(`.matching-item[data-right="${match.right}"]`);
                
                if (leftItem && rightItem) {
                    drawConnection(leftItem, rightItem, index);
                }
            });
        }

        function clearCanvas() {
            const canvas = document.getElementById('matchingCanvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        window.resetMatching = function() {
            matchingState = {
                selectedLeft: null,
                selectedRight: null,
                matches: [],
                attempts: 0
            };

            dragState = {
                isDragging: false,
                startItem: null,
                currentX: 0,
                currentY: 0,
                tempCanvas: null
            };

            document.querySelectorAll('.matching-item').forEach(item => {
                item.classList.remove('selected', 'matched', 'wrong', 'drawing');
            });

            clearCanvas();

            const tempCanvas = document.querySelector('.temp-line');
            if (tempCanvas) {
                tempCanvas.remove();
            }

            const scoreDiv = document.getElementById('matchingScore');
            if (scoreDiv) {
                scoreDiv.classList.remove('show');
            }

            setTimeout(() => {
                setupMatchingCanvas();
            }, 100);
        };

        window.checkMatching = function() {
            const topic = currentTopic;
            if (!topic || !topic.quiz.matchingGame) return;

            const game = topic.quiz.matchingGame;
            let correct = 0;
            let total = game.pairs.length;

            document.querySelectorAll('.matching-item').forEach(item => {
                item.classList.remove('wrong');
            });

            matchingState.matches.forEach(match => {
                if (match.left === match.right) {
                    correct++;
                } else {
                    const leftItem = document.querySelector(`.matching-item[data-left="${match.left}"]`);
                    const rightItem = document.querySelector(`.matching-item[data-right="${match.right}"]`);
                    if (leftItem) leftItem.classList.add('wrong');
                    if (rightItem) rightItem.classList.add('wrong');
                }
            });

            const percentage = Math.round((correct / total) * 100);
            const scoreDiv = document.getElementById('matchingScore');
            
            if (scoreDiv) {
                let message = '';
                let icon = '';
                
                if (percentage === 100) {
                    message = '🎉 Mukammal! Siz barcha so\'zlarni to\'g\'ri birlashtirdingiz!';
                    icon = '🌟';
                } else if (percentage >= 70) {
                    message = '👍 Yaxshi! Ko\'proq mashq qiling.';
                    icon = '😊';
                } else if (percentage >= 50) {
                    message = '📝 Qoniqarli. Qayta urinib ko\'ring.';
                    icon = '🤔';
                } else {
                    message = '❌ Qayta o\'rganing va qayta urinib ko\'ring.';
                    icon = '📚';
                }

                scoreDiv.innerHTML = `
                    <div style="font-size: 2rem; margin-bottom: 10px;">${icon}</div>
                    <div style="font-size: 1.5rem; margin-bottom: 10px;">
                        Natija: ${correct}/${total} (${percentage}%)
                    </div>
                    <div style="font-size: 1.1rem;">${message}</div>
                `;
                scoreDiv.classList.add('show');
                scoreDiv.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }

            matchingState.attempts++;
        };
    </script>
