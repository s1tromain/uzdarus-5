<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <!-- The platform-wide maintenance gate. Loaded FIRST and not deferred:
         it hides the document before anything paints, so a learner never
         sees a flash of the platform they are not supposed to be using. -->
    <script src="maintenance-gate.js"></script>
    <meta name="robots" content="noindex">
    <title>Grammatika (demo) — UzdaRus</title>
    <!--
      The DEMO grammar page. It lives at the site root, outside paid-courses/,
      so it is deliberately NOT behind the paid gate — a visitor trying the
      demo has to be able to read the material of the topics the demo opens.

      What keeps that safe is the limit below: this page serves topics 1-3 of
      any course and refuses everything else, so no paid topic can be read by
      editing the query. It is the same reader, the same data files and the
      same sanitiser the paid pages use; only the limit differs.

      The material of a single topic is generated into
      grammar-data/<course>/<id>.js and fetched on demand by grammar-reader.js,
      so opening one topic downloads about 2-15 KB rather than a 600 KB course
      document. The route names the course and the topic; anything the canon
      does not know is refused with a readable screen, not a blank page.
    -->
    <link rel="stylesheet" href="learning-route.css">
    <style>
        :root { color-scheme: light; }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
            background: #F6F8FC;
            color: #1F2430;
            -webkit-font-smoothing: antialiased;
        }
        .gr-top {
            position: sticky; top: 0; z-index: 5;
            display: flex; align-items: center; gap: 12px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, .92);
            backdrop-filter: saturate(140%) blur(8px);
            border-bottom: 1px solid #E4E7F2;
        }
        .gr-back {
            display: inline-flex; align-items: center; gap: 8px;
            min-height: 44px; padding: 9px 16px;
            border: 1px solid #C9D4EE; border-radius: 999px;
            background: #fff; color: #3F51B5;
            font: inherit; font-weight: 700; font-size: .94rem; cursor: pointer;
        }
        .gr-back:hover { background: #F3F6FF; }
        .gr-back:focus-visible { outline: 3px solid #1F2430; outline-offset: 2px; }
        .gr-top-title {
            font-size: .92rem; font-weight: 800; color: #6B7290;
            letter-spacing: .04em; text-transform: uppercase;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        main { padding: 0 0 8px; }
        /* THE READER STAYS LIGHT ON A DARK PHONE. A prefers-color-scheme: dark
           block used to repaint this page near-black, and the grammar became
           dark text on a dark panel. A page of study material reads like a
           printed page whatever the device is set to. */
        @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
    <header class="gr-top">
        <button type="button" class="gr-back" id="grBack" aria-label="Mavzu sharhiga qaytish">
            <span aria-hidden="true">←</span> Orqaga
        </button>
        <span class="gr-top-title" id="grTop">Grammatika</span>
    </header>

    <main>
        <div id="grammarRoot" role="main" aria-live="polite"></div>
    </main>

    <script src="grammar-reader.js"></script>
    <script>
    (function () {
        'use strict';

        var DEMO_TOPICS = 3;
        var route = window.UzGrammarReader.readRoute(location.search);
        /* THE DEMO LIMIT. This page is public, so it must refuse everything the
           demo does not open — otherwise the whole paid syllabus would be one
           query edit away. */
        if (route.ok && route.topic > DEMO_TOPICS) {
            route = { ok: false, reason: 'topic', course: route.course,
                      topic: route.topic, total: DEMO_TOPICS };
        }
        var course = (route.course || '').toLowerCase();

        /* The demo courses live at the site root and the paid ones in this
           folder, so the way back differs; the route says which. */
        var demo = true;
        var coursePage = course + '-demo.html';
        var vocabPage = course + '-demo-vocabulary.html';

        var top = document.getElementById('grTop');
        if (top && route.ok) top.textContent = route.course + ' · ' + route.topic + '-mavzu';

        /* BACK MUST MEAN BACK. If the learner arrived from the topic overview
           the history entry is theirs and history.back() keeps their scroll
           position; a direct link has no such entry, so fall back to the
           course page for the same topic. */
        var cameFromCourse = document.referrer && /course\.html|demo\.html/.test(document.referrer);
        function goBack() {
            if (cameFromCourse && history.length > 1) { history.back(); return; }
            location.href = coursePage + '?topic=' + (route.topic || 1);
        }
        document.getElementById('grBack').addEventListener('click', goBack);

        window.UzGrammarReader.mount({
            host: document.getElementById('grammarRoot'),
            maxTopic: DEMO_TOPICS,
            base: 'grammar-data/',
            coursePage: coursePage,
            vocabPage: vocabPage,
            onNavigate: function (where) {
                if (where === 'overview') { goBack(); return true; }
                return false;
            }
        });
    })();
    </script>
</body>
</html>
